# nginx config: SPA + reverse proxy /api e /ws pra backend Spring.
#
# ─── FIX DEFINITIVO DO 503 RECORRENTE ──────────────────────────────────────
# Problema antigo: bloco `upstream { server backend:8090; }` resolve o IP do
# service "backend" UMA VEZ na partida do nginx e CACHEIA pra sempre. Quando
# o backend reinicia no swarm (deploy, restart, OOM), ganha IP novo na rede
# overlay, mas o nginx fica martelando o IP velho — 502/503 eterno até dar
# `docker service update` no frontend (que era o "force update" do user).
#
# Fix: usar o DNS embarcado do Docker (127.0.0.11) com TTL curto + passar a
# URL via VARIÁVEL ($backend_upstream) em vez de bloco upstream. Variável
# força o nginx a fazer DNS lookup a CADA request, então qualquer mudança de
# IP no swarm é detectada em <10s sem precisar restartar nada.
#
# `valid=10s` = resultado do DNS cacheia só 10s; depois disso, nova lookup.
# `ipv6=off` = swarm overlay é IPv4-only; evita lookups AAAA que retornam
# vazio + warning no log.
# ────────────────────────────────────────────────────────────────────────────

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    # NÃO mudar pra 80. A VPS tem outros serviços na 80.
    # Backend Spring fica em 8090, frontend nginx em 8999.
    listen 8999;
    server_name _;

    # ─── UPLOAD LIMITS ──────────────────────────────────────────────────────
    # Default do nginx é 1MB → qualquer upload maior (voice clip, foto do
    # Exposure, painting, .wav modulado) volta 413 Request Entity Too Large
    # ANTES de chegar no backend. Subir pra 400M pra bater com:
    #  - Traefik lsmp-bigbody.buffering.maxRequestBodyBytes=419430400 (400M)
    #  - Spring multipart.max-file-size=400MB
    #  - Tomcat max-http-form-post-size=400MB
    client_max_body_size 400M;
    client_body_timeout 600s;
    # Streaming sem buffer no request body — uploads grandes não ficam parados
    # em /tmp do nginx antes de irem pro upstream
    proxy_request_buffering off;

    # SPA: tudo que não for arquivo cai no index.html (react-router)
    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck do frontend — não depende do backend, sempre 200 enquanto
    # o nginx tá vivo.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"ok":true,"service":"frontend"}';
    }

    # gzip nos assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache longo pros assets com hash do Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API REST → backend
    # IMPORTANTE: o `set $backend_upstream ...` antes de `proxy_pass $var` é
    # o que ativa a re-resolução de DNS a cada request. Sem a variável, nginx
    # cacheia o IP de novo.
    location /api/ {
        set $backend_upstream "http://backend:8090";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeouts conservadores — se backend tá lento mas vivo, deixa
        # responder; se tá realmente morto, falha rápido pra o cliente
        # mostrar erro sem ficar pendurado.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # SSE / streaming
        proxy_buffering off;
        proxy_read_timeout 1h;
        # Não dar throw em erro intermediário do backend (5xx) — repassa
        # tal qual pro frontend, que sabe como lidar.
        proxy_intercept_errors off;
        # ─── FIX 503 "upstream temporarily disabled" ─────────────────────
        # Quando backend reinicia (OOM, deploy), nginx tenta uma vez, falha
        # e marca o upstream como "down" por fail_timeout (default 10s).
        # Durante essa janela, retorna 502/503 IMEDIATAMENTE sem nem tentar
        # re-resolver DNS — anula o ganho da resolver dinâmica.
        #
        # proxy_next_upstream + max_fails=0 (via não usar bloco upstream)
        # + retry rápido evita o problema. A variável + resolver vai garantir
        # que cada retry faça novo DNS lookup.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    # WebSocket → backend (mesma técnica de variável)
    location /ws {
        set $ws_upstream "http://backend:8090";
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # WebSocket não dá pra "retry" sem perder estado, mas pelo menos
        # garantir que falha de conexão tenta uma vez antes de desistir
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    # Fallback SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
