server {
    listen 8999;
    server_name _;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Limite 400MB pra uploads (fotos do Exposure, paintings, voice clips longos).
    # Antes era 1MB default — qualquer upload grande quebrava no proxy com 413.
    client_max_body_size 400M;
    client_body_timeout 600s;
    proxy_request_buffering off;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        set $backend_upstream "http://backend:8090";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 5s;
        # Quando backend reinicia (OOM/deploy), tenta de novo com DNS
        # re-resolvido ao invés de marcar upstream como "down" e devolver
        # 503 por 10s. Isso resolve o "connection refused" intermitente
        # quando o container backend recebe IP novo na rede Docker.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    location /ws {
        set $backend_ws_upstream "http://backend:8090";
        proxy_pass $backend_ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;
}
